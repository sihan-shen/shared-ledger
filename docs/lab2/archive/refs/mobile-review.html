<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>用户端 · 待审核详情</title>
<style>
  :root{
    --brand:#0f766e; --brand-2:#14b8a6; --ink:#0f172a; --muted:#64748b; --faint:#94a3b8;
    --line:#e8edf5; --bg:#f3f6fb; --card:#fff; --green:#16a34a; --orange:#d97706; --red:#dc2626;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100vw;height:844px;overflow:hidden;background:#e9eef7}
  body{font-family:"Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:16px}
  .app{position:relative;width:100%;max-width:390px;height:844px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
  .icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .icon.sm{width:16px;height:16px}
  .topbar{height:56px;flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
  .topbar h1{font-size:17px;font-weight:700;margin:0}
  .topbar .left,.topbar .right{width:44px;display:flex;align-items:center}
  .topbar .right{justify-content:flex-end}
  .icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#475569}
  .content{flex:1;min-height:0;overflow:hidden;padding:12px 16px 82px}
  .card{background:#fff;border:1px solid #e9eef7;border-radius:18px;box-shadow:0 6px 18px rgba(15,23,42,.045)}
  .summary{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;margin-bottom:10px}
  .summary .k{font-size:12px;color:var(--muted)}
  .summary .v{font-size:24px;font-weight:800;margin-top:2px;color:var(--brand)}
  .summary .r{text-align:right;font-size:12px;color:var(--faint);line-height:1.6}
  .tabs{display:flex;gap:8px;margin-bottom:10px}
  .tab{height:34px;padding:0 13px;border-radius:9px;border:1px solid #e6ebf3;background:#fff;color:#64748b;font-size:13px;display:flex;align-items:center;gap:5px}
  .tab.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .review{overflow:hidden}
  .review-head{padding:14px 15px 10px;border-bottom:1px solid #f1f5f9}
  .tags{display:flex;gap:5px;align-items:center}
  .tag{font-size:11px;line-height:1;padding:4px 6px;border-radius:5px;background:#f1f5f9;color:#64748b}
  .tag.pending{background:#fff7ed;color:#c2410c}
  .amount{font-size:34px;font-weight:800;letter-spacing:-.8px;margin-top:8px;font-variant-numeric:tabular-nums}
  .amount .cur{font-size:18px;font-weight:600;color:#475569;margin-right:2px}
  .title{font-size:16px;font-weight:700;margin-top:5px}
  .meta{font-size:12px;color:var(--faint);margin-top:4px;line-height:1.5}
  .section{padding:10px 15px 0}
  .sec-title{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:#475569}
  .sec-title span{font-weight:400;color:var(--faint);font-size:11px}
  .alloc{margin-top:5px}
  .alloc-row{display:flex;align-items:center;gap:8px;height:34px;font-size:13px;color:#475569}
  .avatar{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;flex:0 0 auto}
  .avatar.a{background:#0f766e}.avatar.b{background:#8b5cf6}.avatar.c{background:#f59e0b}.avatar.d{background:#14b8a6}
  .alloc-row .name{flex:1}
  .alloc-row .val{font-weight:600;color:#334155;font-variant-numeric:tabular-nums}
  .total{display:flex;justify-content:space-between;border-top:1px dashed #e2e8f0;padding:7px 0 4px;font-size:12px;color:#64748b}
  .total b{font-size:14px;color:#0f172a}
  .verify{margin:9px 15px 0;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:9px;padding:8px 9px;display:flex;gap:7px}
  .verify .icon{color:#15803d;margin-top:1px}
  .verify .t{font-size:12px;font-weight:700;color:#15803d}
  .verify .s{font-size:11px;color:#4d7c5a;line-height:1.5;margin-top:2px}
  .opinion{padding:9px 15px 0}
  .opinion .label{font-size:12px;font-weight:700;color:#475569;display:flex;justify-content:space-between}
  .opinion .label span{font-weight:400;color:#94a3b8;font-size:11px}
  .opinion .box{height:48px;border:1px solid #e2e8f0;background:#fbfcfe;border-radius:9px;margin-top:5px;padding:8px 9px;font-size:12px;color:#b6c2d2;line-height:1.5}
  .footer{position:absolute;z-index:10;left:0;right:0;bottom:0;height:74px;padding:10px 16px 14px;background:rgba(255,255,255,.98);border-top:1px solid var(--line);display:flex;gap:9px}
  .btn{height:50px;border-radius:12px;border:0;font-family:inherit;font-size:15px;font-weight:700;flex:1;display:flex;align-items:center;justify-content:center;gap:5px}
  .btn.reject{background:#fff;border:1px solid #fecaca;color:#dc2626;flex:.8}
  .btn.approve{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 7px 16px rgba(15,118,110,.25)}
  .btn .icon{width:18px;height:18px}
  @media (min-width:600px){
    body{background:#eef2f7}
    .app{max-width:680px;margin:16px auto;border-radius:22px;box-shadow:0 18px 50px rgba(15,23,42,.12);height:812px}
    .content{padding:18px 28px 84px}
    .review-head{padding:16px 20px 12px}.section{padding:12px 20px 0}.verify{margin:10px 20px 0}.opinion{padding:10px 20px 0}
    .footer{left:16px;right:16px;bottom:16px;border-radius:12px;border:0;box-shadow:0 8px 20px rgba(15,23,42,.12)}
  }
  @media (max-width:380px){
    .content{padding-left:14px;padding-right:14px}
    .amount{font-size:31px}
    .footer{padding-left:14px;padding-right:14px}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 19 6v6c0 4.3-3 7.3-7 9-4-1.7-7-4.7-7-9V6l7-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.2 4.2L19 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <div class="left"><div class="icon-btn"><svg class="icon"><use href="#i-back"/></svg></div></div>
    <h1>待审核</h1>
    <div class="right"><div class="icon-btn"><svg class="icon"><use href="#i-more"/></svg></div></div>
  </header>

  <main class="content">
    <section class="card summary">
      <div><div class="k">待我审核</div><div class="v">12</div></div>
      <div class="r">最早提交<br>10-25 20:15</div>
    </section>

    <div class="tabs"><div class="tab on">待我审核 <span>12</span></div><div class="tab">我已处理</div></div>

    <section class="card review">
      <div class="review-head">
        <div class="tags"><span class="tag pending">待审核</span><span class="tag">支出</span><span class="tag">餐饮</span></div>
        <div class="amount"><span class="cur">¥</span>268.00</div>
        <div class="title">周末聚餐</div>
        <div class="meta">2026-10-25 · 孙启翔提交 · 沈思涵付款 · 4 人</div>
      </div>

      <div class="section">
        <div class="sec-title">分摊明细 <span>平均分摊</span></div>
        <div class="alloc">
          <div class="alloc-row"><span class="avatar a">沈</span><span class="name">沈思涵</span><span class="val">¥67.00</span></div>
          <div class="alloc-row"><span class="avatar b">孙</span><span class="name">孙启翔</span><span class="val">¥67.00</span></div>
          <div class="alloc-row"><span class="avatar c">李</span><span class="name">李同学</span><span class="val">¥67.00</span></div>
          <div class="alloc-row"><span class="avatar d">王</span><span class="name">王同学</span><span class="val">¥67.00</span></div>
        </div>
        <div class="total"><span>合计</span><b>¥268.00 · 已平衡</b></div>
      </div>

      <div class="verify">
        <svg class="icon sm"><use href="#i-shield"/></svg>
        <div><div class="t">独立性校验通过</div><div class="s">你不是录入人，也不是该记录待处理申请的申请人；参与分摊不影响审核。</div></div>
      </div>

      <div class="opinion">
        <div class="label">审核意见 <span>驳回时必填</span></div>
        <div class="box">选填；驳回时请说明原因，例如：分摊与说明不一致。</div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <button class="btn reject"><svg class="icon"><use href="#i-x"/></svg>驳回</button>
    <button class="btn approve"><svg class="icon"><use href="#i-check"/></svg>通过</button>
  </footer>
</div>
</body>
</html>
